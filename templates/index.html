<!doctype html>
<html>
  <head><title>Image Search</title></head>
  <body>
    <h1>Upload Image to Search</h1>
    <form method="post" enctype="multipart/form-data">
      <input type="file" name="query" accept="image/*" required>
      <button type="submit">Search</button>
    </form>
  </body>
</html>
